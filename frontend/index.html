<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Pantalla de login</title>
</head>

<body class="min-h-screen">
    <section class="relative min-h-screen overflow-hidden flex items-center justify-center px-6 py-10">

        <!-- Círculos decorativos -->
        <div class="deco absolute -top-24 -left-24 size-72 rounded-full"></div>
        <div class="deco absolute top-1/3 -right-16 size-40 rounded-full opacity-80"></div>
        <div class="deco absolute -bottom-20 -left-16 size-56 rounded-full opacity-70"></div>
        <div class="deco absolute -bottom-28 -right-20 size-80 rounded-full"></div>

        <!-- Botón modo oscuro -->
        <button id="theme" type="button" aria-label="Cambiar tema"
            class="neo-sm absolute top-6 right-6 size-12 rounded-2xl grid place-items-center text-[var(--ink)] cursor-pointer active:scale-95 duration-200">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
        </button>

        <main class="relative w-full max-w-sm flex flex-col items-center">

            <!-- Encabezado -->
            <h1 id="form-title" class="mt-10 text-4xl font-extrabold tracking-tight">Iniciar sesión</h1>

            <!-- Formulario -->
            <form id="auth-form" class="mt-9 w-full flex flex-col gap-4">
                <label
                    class="neo-in hidden flex items-center gap-4 rounded-2xl px-5 h-16 focus-within:ring-2 focus-within:ring-[var(--accent)]/50">
                    <input id="name" type="text" name="name" autocomplete="name" placeholder="Nombre"
                        class="w-full bg-transparent outline-none placeholder:text-[var(--muted)]">
                </label>
                <label
                    class="neo-in flex items-center gap-4 rounded-2xl px-5 h-16 focus-within:ring-2 focus-within:ring-[var(--accent)]/50">
                    <input type="email" name="email" autocomplete="email" placeholder="Correo electrónico" required
                        class="w-full bg-transparent outline-none placeholder:text-[var(--muted)]">
                </label>

                <label
                    class="neo-in flex items-center gap-4 rounded-2xl px-5 h-16 focus-within:ring-2 focus-within:ring-[var(--accent)]/50">
                    <input id="password" type="password" name="password" autocomplete="current-password"
                        placeholder="Contraseña" required
                        class="w-full bg-transparent outline-none placeholder:text-[var(--muted)]">
                    <button id="toggle-password" type="button" aria-label="Mostrar contraseña"
                        class="text-[var(--muted)] cursor-pointer">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                            <circle cx="12" cy="12" r="3" />
                            <path id="slash" d="M4 4l16 16" />
                        </svg>
                    </button>
                </label>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="remember" class="sr-only" checked>
                        <span class="size-7 rounded-lg grid place-items-center shadow-md">
                            <svg class="opacity-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white"
                                stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12.5l4.5 4.5L19 7" />
                            </svg>
                        </span>
                        Recordarme
                    </label>
                    <a href="#" class="font-semibold text-[var(--accent)] hover:underline">¿Olvidaste tu contraseña?</a>
                </div>

                <button id="submit-btn" type="submit"
                    class="btn-main relative mt-1 h-16 rounded-full text-white text-xl font-semibold cursor-pointer hover:brightness-110 active:scale-[0.98] duration-300">
                    Ingresar
                </button>
                <p id="message" class="min-h-5 text-sm" role="status" aria-live="polite"></p>
            </form>

            <!-- Separador -->
            <div class="mt-8 w-full flex items-center gap-4 text-xs tracking-[0.25em] text-[var(--muted)]">
                <hr class="flex-1 border-[var(--accent)]/40">
                <span>O continúa con</span>
                <hr class="flex-1 border-[var(--accent)]/40">
            </div>

            <!-- Redes sociales -->
            <div class="mt-6 flex gap-5">
                <button type="button" aria-label="Google" id="google-fallback"
                    class="neo-sm size-[4.5rem] rounded-3xl grid place-items-center cursor-pointer hover:-translate-y-1 active:scale-95 duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                </button>
                <div id="google-btn" class="hidden"></div>
            </div>

            <p class="mt-8 text-sm text-[var(--muted)]">
                <span id="toggle-text">¿No tienes cuenta?</span>
                <button id="toggle-mode" type="button"
                    class="font-semibold text-[var(--accent)] hover:underline">Regístrate</button>
            </p>
        </main>
    </section>

    <script src="app.js"></script>
</body>

</html>
